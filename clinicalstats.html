<script type="text/babel">
const {useState,useEffect,useCallback,useRef,useMemo}=React;
const {LineChart,Line,BarChart,Bar,ScatterChart,Scatter,AreaChart,Area,XAxis,YAxis,CartesianGrid,Tooltip,Legend,ReferenceLine,ResponsiveContainer,ComposedChart,ErrorBar}=Recharts;

// ================================================================
// STATISTICAL UTILITY FUNCTIONS
// ================================================================
const lgamma=(x)=>{const g=7,C=[.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];if(x<.5)return Math.log(Math.PI/Math.sin(Math.PI*x))-lgamma(1-x);x-=1;let a=C[0];const t=x+g+.5;for(let i=1;i<g+2;i++)a+=C[i]/(x+i);return .5*Math.log(2*Math.PI)+(x+.5)*Math.log(t)-t+Math.log(a)};
const sN=v=>typeof v==='number'&&isFinite(v)&&!isNaN(v);
const mean=a=>!(a&&a.length)?NaN:a.reduce((s,v)=>s+v,0)/a.length;
const median=a=>{if(!(a&&a.length))return NaN;const s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2};
const sd=a=>{if(!a||a.length<2)return NaN;const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1))};
const sdp=a=>{if(!a||a.length<1)return NaN;const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/a.length)};
const cv=a=>{const m=mean(a),s=sd(a);return sN(m)&&m!==0&&sN(s)?(s/Math.abs(m))*100:NaN};
const pct=(a,p)=>{if(!(a&&a.length))return NaN;const s=[...a].sort((x,y)=>x-y),i=(p/100)*(s.length-1),lo=Math.floor(i),hi=Math.ceil(i);return lo===hi?s[lo]:s[lo]+(i-lo)*(s[hi]-s[lo])};
const fmt=(v,d=4)=>sN(v)?v.toFixed(d):'—';
const fmt2=(v,d=2)=>sN(v)?v.toFixed(d):'—';
const fmtP=p=>{if(!sN(p))return'—';if(p<.0001)return'<0.0001';if(p<.001)return p.toFixed(4);if(p<.01)return p.toFixed(3);return p.toFixed(3)};
const skew=a=>{const n=a.length,m=mean(a),s=sd(a);if(n<3||s===0)return NaN;return a.reduce((t,v)=>t+((v-m)/s)**3,0)*n/((n-1)*(n-2))};
const kurt=a=>{const n=a.length,m=mean(a),s=sd(a);if(n<4||s===0)return NaN;const k=a.reduce((t,v)=>t+((v-m)/s)**4,0);return (n*(n+1)/((n-1)*(n-2)*(n-3)))*k-(3*(n-1)**2/((n-2)*(n-3)))};
const sem=a=>{const n=a.length,s=sd(a);return n>0?s/Math.sqrt(n):NaN};
const rBI=(x,a,b)=>{if(x<=0)return 0;if(x>=1)return 1;const pf=Math.exp(a*Math.log(x)+b*Math.log(1-x)-(lgamma(a)+lgamma(b)-lgamma(a+b)));let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<1e-30)d=1e-30;d=1/d;let h=d;for(let m=1;m<=200;m++){let m2=2*m,aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;d=1/d;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;d=1/d;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;h*=d*c;if(Math.abs(d*c-1)<1e-14)break}return pf*h/a};
const tCDF=(t,df)=>{if(!sN(t)||!sN(df)||df<=0)return NaN;const ib=rBI(df/(df+t*t),df/2,.5);return t>=0?1-.5*ib:.5*ib};
const tInv=(p,df)=>{if(p<=0)return -1e9;if(p>=1)return 1e9;let lo=-100,hi=100;for(let i=0;i<80;i++){const mid=(lo+hi)/2;tCDF(mid,df)<p?lo=mid:hi=mid;if(hi-lo<1e-9)break}return(lo+hi)/2};
const fCDF=(f,d1,d2)=>{if(!sN(f)||f<=0)return 0;return rBI(d1*f/(d1*f+d2),d1/2,d2/2)};
const fInv=(p,df1,df2)=>{if(p<=0)return 0;if(p>=1)return 1e9;let lo=0,hi=1e4;for(let i=0;i<80;i++){const mid=(lo+hi)/2;fCDF(mid,df1,df2)<p?lo=mid:hi=mid;if(hi-lo<1e-9)break}return(lo+hi)/2};
const normCDF=z=>{const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2),p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p};
const normInv=p=>{if(p<=0)return-1e9;if(p>=1)return 1e9;let lo=-10,hi=10;for(let i=0;i<80;i++){const mid=(lo+hi)/2;normCDF(mid)<p?lo=mid:hi=mid;if(hi-lo<1e-9)break}return(lo+hi)/2};

// Regularized lower incomplete gamma (for chi-squared and gamma distributions)
const regGammaP=(a,x)=>{if(x<0)return 0;if(x===0)return 0;if(x<a+1){let ap=a,del=1/a,sum=del;for(let i=0;i<200;i++){ap++;del*=x/ap;sum+=del;if(Math.abs(del)<1e-12*Math.abs(sum))break}return sum*Math.exp(-x+a*Math.log(x)-lgamma(a))}else{let b=x+1-a,c=1e30,d=1/b,h=d;for(let i=1;i<=200;i++){const an=-i*(i-a),b2=b+2*i;d=an*d+b2;if(Math.abs(d)<1e-30)d=1e-30;c=b2+an/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;h*=d*c;if(Math.abs(d*c-1)<1e-14)break}return 1-Math.exp(-x+a*Math.log(x)-lgamma(a))*h}};
const chi2CDF=(x,k)=>x<=0?0:regGammaP(k/2,x/2);
const chi2Inv=(p,df)=>{if(p<=0)return 0;if(p>=1)return 1e9;let lo=0,hi=df*20+200;for(let i=0;i<100;i++){const mid=(lo+hi)/2;chi2CDF(mid,df)<p?lo=mid:hi=mid;if(hi-lo<1e-9)break}return(lo+hi)/2};

// Pearson correlation
const pearsonR=(x,y)=>{const n=x.length;if(n<2)return NaN;const mx=mean(x),my=mean(y);let num=0,dx=0,dy=0;for(let i=0;i<n;i++){num+=(x[i]-mx)*(y[i]-my);dx+=(x[i]-mx)**2;dy+=(y[i]-my)**2}return dx*dy>0?num/Math.sqrt(dx*dy):NaN};

// Spearman rank correlation
const spearman=(x,y)=>{const n=x.length;const rankArr=arr=>{const s=[...arr].map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v);const r=new Array(n);let i=0;while(i<n){let j=i;while(j<n-1&&s[j+1].v===s[j].v)j++;const avg=(i+j+2)/2;for(let k=i;k<=j;k++)r[s[k].i]=avg;i=j+1}return r};const rx=rankArr(x),ry=rankArr(y);return pearsonR(rx,ry)};

// Shapiro-Wilk approximation (Royston 1995 approximation via normality check)
const shapiroWilk=(a)=>{const n=a.length;if(n<3||n>5000)return{w:NaN,p:NaN};const s=[...a].sort((x,y)=>x-y);const m=mean(s),v=a.reduce((t,x)=>t+(x-m)**2,0);if(v===0)return{w:1,p:1};// Approximate W using correlation of sorted data with expected normal quantiles
const q=s.map((_,i)=>normInv((i+1-.375)/(n+.25)));const r=pearsonR(s,q);const W=r*r;// P-value approximation
const z=Math.log(1-W),mu=-1.2725+1.0521*(Math.log(n)),sig=1.0308-0.26763*(Math.log(n))**0.5;const zz=(z-mu)/sig;const p=1-normCDF(zz);return{w:W,p:Math.max(0,Math.min(1,p))}};

// Grubbs test for outliers
const grubbsTest=(a,alpha=.05)=>{const n=a.length;if(n<3)return{outlier:null,G:NaN,critical:NaN,isOut:false};const m=mean(a),s=sd(a);const G=Math.max(...a.map(v=>Math.abs(v-m)))/s;const tp=tInv(alpha/(2*n),n-2);const critical=(n-1)/Math.sqrt(n)*Math.sqrt(tp**2/(n-2+tp**2));const idx=a.reduce((mi,v,i)=>Math.abs(v-m)>Math.abs(a[mi]-m)?i:mi,0);return{outlier:a[idx],G,critical,isOut:G>critical,idx}};

// Mann-Whitney U test
const mannWhitney=(x,y)=>{const nx=x.length,ny=y.length;const all=[...x.map(v=>({v,g:0})),...y.map(v=>({v,g:1}))].sort((a,b)=>a.v-b.v);const ranks=new Array(nx+ny);let i=0;while(i<ranks.length){let j=i;while(j<ranks.length-1&&all[j+1].v===all[j].v)j++;const avg=(i+j+2)/2;for(let k=i;k<=j;k++)ranks[k]=avg;i=j+1}let Rx=0;for(let k=0;k<ranks.length;k++)if(all[k].g===0)Rx+=ranks[k];const U=Rx-nx*(nx+1)/2;const mu=nx*ny/2,sig=Math.sqrt(nx*ny*(nx+ny+1)/12);const z=(U-mu)/sig;const p=2*(1-normCDF(Math.abs(z)));return{U,z,p}};

// Wilcoxon signed-rank test
const wilcoxon=(a,b)=>{const diff=a.map((v,i)=>v-(b?b[i]:0)).filter(d=>d!==0);const n=diff.length;if(n<1)return{W:NaN,p:NaN};const abs=diff.map(d=>Math.abs(d));const sorted=[...abs].map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v);const ranks=new Array(n);let i=0;while(i<n){let j=i;while(j<n-1&&sorted[j+1].v===sorted[j].v)j++;const avg=(i+j+2)/2;for(let k=i;k<=j;k++)ranks[k]=avg;i=j+1}let Wp=0;for(let k=0;k<n;k++)if(diff[sorted[k].i]>0)Wp+=ranks[k];const mu=n*(n+1)/4,sig=Math.sqrt(n*(n+1)*(2*n+1)/24);const z=(Wp-mu)/sig;const p=2*(1-normCDF(Math.abs(z)));return{W:Wp,z,p}};

// Kruskal-Wallis test
const kruskalWallis=(groups)=>{const all=[].concat(...groups.map((g,i)=>g.map(v=>({v,g:i}))));all.sort((a,b)=>a.v-b.v);const n=all.length,k=groups.length;const ranks=new Array(n);let i=0;while(i<n){let j=i;while(j<n-1&&all[j+1].v===all[j].v)j++;const avg=(i+j+2)/2;for(let kk=i;kk<=j;kk++)ranks[kk]=avg;i=j+1}const Rg=groups.map(_=>0);for(let k=0;k<n;k++)Rg[all[k].g]+=ranks[k];const H=12/(n*(n+1))*groups.reduce((s,g,i)=>s+Rg[i]**2/g.length,0)-3*(n+1);const p=1-chi2CDF(H,k-1);return{H,p,df:k-1}};

// Passing-Bablok regression (CLSI EP9-A3)
const passingBablok=(x,y)=>{const n=x.length;if(n<3)return null;const slopes=[];for(let i=0;i<n-1;i++)for(let j=i+1;j<n;j++){const dx=x[j]-x[i];if(Math.abs(dx)>1e-10)slopes.push((y[j]-y[i])/dx)}slopes.sort((a,b)=>a-b);const m=slopes.length;const slope=m%2===1?slopes[(m-1)/2]:(slopes[m/2-1]+slopes[m/2])/2;const ints=x.map((xi,i)=>y[i]-slope*xi).sort((a,b)=>a-b);const intercept=ints.length%2===1?ints[(ints.length-1)/2]:(ints[ints.length/2-1]+ints[ints.length/2])/2;const Ci=1.96*Math.sqrt(n*(n-1)*(2*n+5)/18);const Mlo=Math.round((m-Ci)/2)-1,Mhi=m-1-Math.round((m-Ci)/2)+1;const slopeCI=[slopes[Math.max(0,Mlo)]||slopes[0],slopes[Math.min(m-1,Mhi)]||slopes[m-1]];const intLo=ints[Math.max(0,Math.round((ints.length-Ci)/2))];const intHi=ints[Math.min(ints.length-1,Math.round((ints.length+Ci)/2))];const yhat=x.map(xi=>slope*xi+intercept);const my=mean(y);const ssr=y.reduce((s,yi,i)=>s+(yi-yhat[i])**2,0);const sst=y.reduce((s,yi)=>s+(yi-my)**2,0);const r2=1-ssr/sst;return{slope,intercept,slopeCI,intCI:[intLo||ints[0],intHi||ints[ints.length-1]],n,r2,method:'Passing-Bablok (CLSI EP9-A3)'}};

// Ordinary Deming regression
const demReg=(x,y,lam=1)=>{const n=x.length;if(n<4)return null;const mx=mean(x),my=mean(y);let sxx=0,syy=0,sxy=0;for(let i=0;i<n;i++){sxx+=(x[i]-mx)**2;syy+=(y[i]-my)**2;sxy+=(x[i]-mx)*(y[i]-my)}sxx/=(n-1);syy/=(n-1);sxy/=(n-1);if(Math.abs(sxy)<1e-15)return null;const u=syy-lam*sxx;const slope=(u+Math.sqrt(u**2+4*lam*sxy**2))/(2*sxy);const intercept=my-slope*mx;return{slope,intercept,n,mx,my,sxx,syy,sxy}};

const demJackCI=(x,y,lam=1,alpha=.05)=>{const n=x.length;if(n<6)return null;const full=demReg(x,y,lam);if(!full||!sN(full.slope))return null;const psSl=[],psIn=[];for(let i=0;i<n;i++){const xs=x.filter((_,j)=>j!==i),ys=y.filter((_,j)=>j!==i),r=demReg(xs,ys,lam);if(!r||!sN(r.slope))continue;psSl.push(n*full.slope-(n-1)*r.slope);psIn.push(n*full.intercept-(n-1)*r.intercept)}const k=psSl.length;if(k<4)return null;const mSl=mean(psSl),mIn=mean(psIn);const seSl=Math.sqrt(psSl.reduce((s,v)=>s+(v-mSl)**2,0)/(k*(k-1))),seIn=Math.sqrt(psIn.reduce((s,v)=>s+(v-mIn)**2,0)/(k*(k-1)));const tC=tInv(1-alpha/2,k-1);return{slope:full.slope,intercept:full.intercept,seSlope:seSl,seIntercept:seIn,slopeCI:[full.slope-tC*seSl,full.slope+tC*seSl],intCI:[full.intercept-tC*seIn,full.intercept+tC*seIn],n:k,method:'Deming (Linnet jackknife)'}};

const wDemReg=(x,y,lam=1)=>{const n=x.length;if(n<4)return null;const w=x.map((xi,i)=>{const avg=(xi+y[i])/2;return avg>0?1/(avg*avg):1});const sw=w.reduce((a,b)=>a+b,0);const wn=w.map(v=>v/sw*n);const wmx=x.reduce((s,xi,i)=>s+wn[i]*xi,0)/n,wmy=y.reduce((s,yi,i)=>s+wn[i]*yi,0)/n;let sxx=0,syy=0,sxy=0;for(let i=0;i<n;i++){sxx+=wn[i]*(x[i]-wmx)**2;syy+=wn[i]*(y[i]-wmy)**2;sxy+=wn[i]*(x[i]-wmx)*(y[i]-wmy)}sxx/=n-1;syy/=n-1;sxy/=n-1;if(Math.abs(sxy)<1e-15)return null;const sl=(syy-lam*sxx+Math.sqrt((syy-lam*sxx)**2+4*lam*sxy**2))/(2*sxy);return{slope:sl,intercept:wmy-sl*wmx,weights:wn}};

const wDemJackCI=(x,y,lam=1,alpha=.05)=>{const n=x.length;if(n<6)return null;const full=wDemReg(x,y,lam);if(!full||!sN(full.slope))return null;const psSl=[],psIn=[];for(let i=0;i<n;i++){const xs=x.filter((_,j)=>j!==i),ys=y.filter((_,j)=>j!==i),r=wDemReg(xs,ys,lam);if(!r||!sN(r.slope))continue;psSl.push(n*full.slope-(n-1)*r.slope);psIn.push(n*full.intercept-(n-1)*r.intercept)}const k=psSl.length;if(k<4)return null;const mSl=mean(psSl),mIn=mean(psIn);const seSl=Math.sqrt(psSl.reduce((s,v)=>s+(v-mSl)**2,0)/(k*(k-1))),seIn=Math.sqrt(psIn.reduce((s,v)=>s+(v-mIn)**2,0)/(k*(k-1)));const tC=tInv(1-alpha/2,k-1);return{slope:full.slope,intercept:full.intercept,seSlope:seSl,seIntercept:seIn,slopeCI:[full.slope-tC*seSl,full.slope+tC*seSl],intCI:[full.intercept-tC*seIn,full.intercept+tC*seIn],n:k,method:'Weighted Deming (Linnet jackknife)'}};

// Linear regression (OLS)

// ---- T-TEST ----
const TTP=({cols,th})=>{
const [type,setType]=useState('one');const [selCol1,setSelCol1]=useState(0);const [selCol2,setSelCol2]=useState(1);
const [mu0,setMu0]=useState('0');const [alpha,setAlpha]=useState('0.05');const [alt,setAlt]=useState('two');
const [res,setRes]=useState(null);
if(!cols.length)return<Card th={th}><div style={{color:th.sub}}>Ladda data först.</div></Card>;
const run=()=>{const a=cols[selCol1]?.values||[];const b=cols[selCol2]?.values||[];const al=parseFloat(alpha)||.05;const mu=parseFloat(mu0)||0;if(type==='one'){const n=a.length,m=mean(a),s=sd(a),se=s/Math.sqrt(n),t=(m-mu)/se,df=n-1,p=alt==='two'?2*(1-tCDF(Math.abs(t),df)):alt==='greater'?1-tCDF(t,df):tCDF(t,df);const tC=tInv(1-al/2,df);setRes({type:'one',n,mean:m,sd:s,se,t,df,p,ci:[m-tC*se,m+tC*se],alt})}else if(type==='welch'){const n1=a.length,n2=b.length,m1=mean(a),m2=mean(b),s1=sd(a),s2=sd(b);const se=Math.sqrt(s1**2/n1+s2**2/n2),t=(m1-m2)/se,df=(s1**2/n1+s2**2/n2)**2/((s1**2/n1)**2/(n1-1)+(s2**2/n2)**2/(n2-1)),p=alt==='two'?2*(1-tCDF(Math.abs(t),df)):alt==='greater'?1-tCDF(t,df):tCDF(t,df);const tC=tInv(1-al/2,df);setRes({type:'welch',n1,n2,m1,m2,s1,s2,t,df,p,ci:[(m1-m2)-tC*se,(m1-m2)+tC*se]})}else{const d=a.map((v,i)=>v-(b[i]||0));const n=d.length,m=mean(d),s=sd(d),se=s/Math.sqrt(n),t=m/se,df=n-1,p=alt==='two'?2*(1-tCDF(Math.abs(t),df)):alt==='greater'?1-tCDF(t,df):tCDF(t,df);const tC=tInv(1-al/2,df);setRes({type:'paired',n,meanD:m,sdD:s,t,df,p,ci:[m-tC*se,m+tC*se]})}};
return(<div>
<PageTitle title="📐 T-test" sub="Ettailat, tvåailat (Welch), parat — CLSI EP5" th={th}/>
<Card th={th}>
<div className="row">
<Field label="Testtyp"><Sel value={type} onChange={setType} options={[{value:'one',label:'Ensamplingstest'},{value:'welch',label:'Tvåsamplingstest (Welch)'},{value:'paired',label:'Parat t-test'}]} th={th}/></Field>
<Field label="Alternativ hypotes"><Sel value={alt} onChange={setAlt} options={[{value:'two',label:'Tvåsidigt (≠)'},{value:'greater',label:'Ensidigt (>)'},{value:'less',label:'Ensidigt (<)'}]} th={th}/></Field>
<Field label="Signifikansnivå (α)"><Inp value={alpha} onChange={setAlpha} type="number" step="0.01" th={th}/></Field>
</div>
<div className="row">
<Field label={type==='one'?'Kolumn':'Kolumn 1'}><Sel value={selCol1} onChange={v=>setSelCol1(+v)} options={cols.map((c,i)=>({value:i,label:c.name}))} th={th}/></Field>
{type!=='one'&&<Field label="Kolumn 2"><Sel value={selCol2} onChange={v=>setSelCol2(+v)} options={cols.map((c,i)=>({value:i,label:c.name}))} th={th}/></Field>}
{type==='one'&&<Field label="Testvärde μ₀"><Inp value={mu0} onChange={setMu0} type="number" th={th}/></Field>}
</div>

// ---- FRIEDMAN ----
const FriedmanP=({cols,th})=>{
const [sels,setSels]=useState([]);const [res,setRes]=useState(null);
if(!cols.length)return<Card th={th}><div style={{color:th.sub}}>Ladda data först.</div></Card>;
const run=()=>{const gs=sels.length>0?cols.filter((_,i)=>sels.includes(i)):cols.slice(0,Math.min(5,cols.length));if(gs.length<3)return;const k=gs.length,n=Math.min(...gs.map(c=>c.values.length));if(n<3)return;const blocks=Array.from({length:n},(_,i)=>gs.map(c=>c.values[i]));const ranks=blocks.map(row=>{const s=row.map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v);const r=new Array(k);let ii=0;while(ii<k){let jj=ii;while(jj<k-1&&s[jj+1].v===s[jj].v)jj++;const avg=(ii+jj+2)/2;for(let kk=ii;kk<=jj;kk++)r[s[kk].i]=avg;ii=jj+1}return r});const Rj=gs.map((_,j)=>ranks.reduce((s,r)=>s+r[j],0));const T1=12/(n*k*(k+1))*Rj.reduce((s,r)=>s+r**2,0)-3*n*(k+1);const p=1-chi2CDF(T1,k-1);setRes({T:T1,df:k-1,p,Rj,groups:gs.map((g,j)=>({name:g.name,rankSum:Rj[j],meanRank:Rj[j]/n}))})};
return(<div>
<PageTitle title="📊 Friedman-test" sub="Icke-parametrisk upprepade mätningar" th={th}/>
<Card th={th}><Field label="Välj kolumner (grupper)"><select multiple value={sels.map(String)} onChange={e=>setSels([...e.target.selectedOptions].map(o=>+o.value))} style={{background:th.input,borderColor:th.inputBorder,color:th.text,height:90}} size={4}>{cols.map((c,i)=><option key={i} value={i}>{c.name}</option>)}</select></Field>
<Btn onClick={run} th={th}>Kör Friedman</Btn></Card>
{res&&<>
<Card th={th}><Tbl headers={['Parameter','Värde']} rows={[['χ²-statistika (T)',fmt(res.T,4)],['df',res.df],['p-värde',fmtP(res.p)],['Slutsats',res.p<.05?'✓ Signifikant skillnad':'✗ Ingen signifikant skillnad']]} th={th}/></Card>
<Card th={th}><Tbl headers={['Grupp','Ranksumma','Medelrang']} rows={res.groups.map(g=>[g.name,fmt2(g.rankSum),fmt2(g.meanRank)])} th={th}/></Card>
</>}
</div>)};

// ---- CHI-SQUARED ----
const Chi2P=({cols,th})=>{
const [text,setText]=useState('');const [res,setRes]=useState(null);
const run=()=>{const rows=text.trim().split('\n').map(r=>r.split(/[\t,;]/).map(v=>parseFloat(v.replace(',','.'))));const matrix=rows.filter(r=>r.every(sN));if(matrix.length<2||matrix[0].length<2){setRes({err:'Ange en 2×2 eller större kontingenstabell'});return}const R=matrix.length,C=matrix[0].length,N=matrix.reduce((s,r)=>s+r.reduce((a,b)=>a+b,0),0);const rowTots=matrix.map(r=>r.reduce((a,b)=>a+b,0));const colTots=Array.from({length:C},(_,j)=>matrix.reduce((s,r)=>s+r[j],0));let chi2=0;for(let r=0;r<R;r++)for(let c=0;c<C;c++){const E=rowTots[r]*colTots[c]/N;chi2+=(matrix[r][c]-E)**2/E}const df=(R-1)*(C-1),p=1-chi2CDF(chi2,df);setRes({chi2,df,p,matrix,R,C,N})};
return(<div>
<PageTitle title="χ² Chi-kvadrattest" sub="Oberoende-test för kontingenstabeller" th={th}/>
<Card th={th}><Field label="Kontingenstabell (tab/komma-separerat, en rad per rad)"><textarea value={text} onChange={e=>setText(e.target.value)} rows={5} style={{background:th.input,borderColor:th.inputBorder,color:th.text,width:'100%',borderRadius:6,padding:'6px 10px',fontFamily:'monospace',fontSize:12}} placeholder="20	10&#10;15	25"/></Field>
<Btn onClick={run} th={th}>Beräkna</Btn></Card>
{res&&(res.err?<Card th={th}><div className="red">{res.err}</div></Card>:

<Tbl headers={['Parameter','Värde']} rows={[['χ²-statistika',fmt(res.chi2,4)],['df',(res.R-1)*(res.C-1)],['p-värde',fmtP(res.p)],['N',res.N],['Slutsats',res.p<.05?'✓ Signifikant association':'✗ Ingen signifikant association']]} th={th}/>
</Card>)}
</div>)};

const QRegP=({cols,th})=>{
const [selX,setSelX]=useState(0);const [selY,setSelY]=useState(1);const [q,setQ]=useState('0.5');const [res,setRes]=useState(null);
if(!cols.length)return<Card th={th}><div style={{color:th.sub}}>Ladda data först.</div></Card>;
// Simple quantile regression (minimize weighted absolute deviations)
const run=()=>{const x=cols[selX]?.values||[],y=cols[selY]?.values||[];const n=Math.min(x.length,y.length);const tau=parseFloat(q)||.5;const xs=x.slice(0,n),ys=y.slice(0,n);const mx=mean(xs),my=mean(ys);// Simple iterative weighted LS approximation
let b1=1,b0=my-b1*mx;for(let iter=0;iter<100;iter++){const resid=ys.map((yi,i)=>yi-(b0+b1*xs[i]));const w=resid.map(r=>Math.abs(r)<.001?.001:Math.abs(r));const wt=resid.map((r,i)=>r>=0?tau/w[i]:(1-tau)/w[i]);const swx=wt.reduce((s,wi,i)=>s+wi*xs[i],0),swy=wt.reduce((s,wi,i)=>s+wi*ys[i],0),sw=wt.reduce((a,b)=>a+b,0);const wmx=swx/sw,wmy=swy/sw;const nb1=wt.reduce((s,wi,i)=>s+wi*(xs[i]-wmx)*(ys[i]-wmy),0)/wt.reduce((s,wi,i)=>s+wi*(xs[i]-wmx)**2,.001);const nb0=wmy-nb1*wmx;if(Math.abs(nb1-b1)<1e-8&&Math.abs(nb0-b0)<1e-8)break;b1=nb1;b0=nb0}setRes({b0,b1,tau,n})};
return(<div>

<div className="row">
<Field label="X"><Sel value={selX} onChange={v=>setSelX(+v)} options={cols.map((c,i)=>({value:i,label:c.name}))} th={th}/></Field>

<Field label="Kvantil τ (0-1)"><Inp value={q} onChange={setQ} type="number" step="0.05" th={th}/></Field>
</div>
<Btn onClick={run} th={th}>Beräkna kvantilregression</Btn>
{res&&<Card th={th}><h3>Kvantilregression (τ={res.tau})</h3>
<Tbl headers={['Parameter','Värde']} rows={[['Intercept',fmt(res.b0,4)],['Lutning',fmt(res.b1,4)],['Kvantil',res.tau],['n',res.n]]} th={th}/>
</Card>}
</div>)};

// ---- DUPLICATE CV ----
const DupCVP=({cols,th})=>{
const [sel1,setSel1]=useState(0);const [sel2,setSel2]=useState(1);const [res,setRes]=useState(null);
if(!cols.length)return<Card th={th}><div style={{color:th.sub}}>Ladda data först.</div></Card>;
const run=()=>{const a=cols[sel1]?.values||[],b=cols[sel2]?.values||[];const n=Math.min(a.length,b.length);const pairs=Array.from({length:n},(_,i)=>({a:a[i],b:b[i],mean:(a[i]+b[i])/2,diff:a[i]-b[i]}));const repeatCV=Math.sqrt(pairs.reduce((s,p)=>s+(p.diff**2)/2,0)/n)/mean(pairs.map(p=>p.mean))*100;const sdWithin=Math.sqrt(pairs.reduce((s,p)=>s+(p.diff**2)/2,0)/n);setRes({n,repeatCV,sdWithin,pairs:pairs.slice(0,20)})};
return(<div>
<PageTitle title="📊 Duplikat-CV" sub="Precision från duplikatmätningar" th={th}/>
<div className="row">
<Field label="Mätning 1"><Sel value={sel1} onChange={v=>setSel1(+v)} options={cols.map((c,i)=>({value:i,label:c.name}))} th={th}/></Field>
<Field label="Mätning 2 (duplikat)"><Sel value={sel2} onChange={v=>setSel2(+v)} options={cols.map((c,i)=>({value:i,label:c.name}))} th={th}/></Field>
</div>
<Btn onClick={run} th={th}>Beräkna</Btn>
{res&&<><Card th={th}><Tbl headers={['Parameter','Värde']} rows={[['n par',res.n],['Repeterbarhet SD',fmt(res.sdWithin,4)],['Repeterbarhet CV%',fmt2(res.repeatCV)+'%']]} th={th}/></Card>
<Card th={th}><Tbl headers={['Mät.1','Mät.2','Medelvärde','Differens']} rows={res.pairs.map(p=>[p.a.toFixed(4),p.b.toFixed(4),p.mean.toFixed(4),p.diff.toFixed(4)])} th={th}/></Card></>}
</div>)};

// ---- MULTIPLE REGRESSION ----
const MultiRegP=({cols,th})=>{
const [selY,setSelY]=useState(0);const [selXs,setSelXs]=useState([]);const [res,setRes]=useState(null);
if(!cols.length)return<Card th={th}><div style={{color:th.sub}}>Ladda data först.</div></Card>;
const run=()=>{const ycol=cols[selY]?.values||[];const xcols=selXs.length>0?selXs.map(i=>cols[i]?.values||[]):[cols.filter((_,i)=>i!==selY)[0]?.values||[]];const n=Math.min(ycol.length,...xcols.map(x=>x.length));const y=ycol.slice(0,n);const X=xcols.map(x=>x.slice(0,n));// OLS via normal equations (simplified for 1-3 predictors)
if(X.length===1){const r=linReg(X[0],y);if(r)setRes({...r,type:'simple',xNames:[cols[selXs[0]||1]?.name||'X'],yName:cols[selY].name})}else{// Multiple OLS
const k=X.length;const Xm=Array.from({length:n},(_,i)=>[1,...X.map(x=>x[i])]);// XtX
const XtX=Array.from({length:k+1},(_,r)=>Array.from({length:k+1},(_,c)=>Xm.reduce((s,row)=>s+row[r]*row[c],0)));const Xty=Array.from({length:k+1},(_,r)=>Xm.reduce((s,row,i)=>s+row[r]*y[i],0));// Gaussian elimination
const m=XtX.map((r,i)=>[...r,Xty[i]]);for(let c=0;c<=k;c++){const mx=m.reduce((bi,row,ri)=>Math.abs(row[c])>Math.abs(m[bi][c])?ri:bi,c);[m[c],m[mx]]=[m[mx],m[c]];for(let r2=0;r2<=k;r2++)if(r2!==c&&Math.abs(m[c][c])>1e-15){const f=m[r2][c]/m[c][c];m[r2]=m[r2].map((v,j)=>v-f*m[c][j])}}const betas=m.map((row,i)=>row[k+1]/row[i]);const yhat=Xm.map(row=>row.reduce((s,v,i)=>s+v*betas[i],0));const sse=y.reduce((s,yi,i)=>s+(yi-yhat[i])**2,0);const my=mean(y),sst=y.reduce((s,yi)=>s+(yi-my)**2,0);const r2=1-sse/sst;const mse=sse/(n-k-1);setRes({betas,r2,mse,n,k,sse,sst,xNames:(selXs.length>0?selXs:[(selY+1)%cols.length]).map(i=>cols[i]?.name||'X'+i),yName:cols[selY].name,type:'multiple'})}};
return(<div>
<PageTitle title="📐 Multipel regression" sub="OLS linjär regression med flera prediktorer" th={th}/>
<Card th={th}><div className="row">
<Field label="Y (utfall)"><Sel value={selY} onChange={v=>setSelY(+v)} options={cols.map((c,i)=>({value:i,label:c.name}))} th={th}/></Field>
<Field label="X-prediktorer (Ctrl)"><select multiple value={selXs.map(String)} onChange={e=>setSelXs([...e.target.selectedOptions].map(o=>+o.value))} style={{background:th.input,borderColor:th.inputBorder,color:th.text,height:80}} size={4}>{cols.map((c,i)=><option key={i} value={i}>{c.name}</option>)}</select></Field>
</div><Btn onClick={run} th={th}>Beräkna regression</Btn></Card>
{res&&<Card th={th}><h3>{res.type==='simple'?'Enkel OLS':'Multipel OLS'} — R²={fmt2(res.r2)}</h3>
{res.type==='simple'?<Tbl headers={['Parameter','Estimat','SE','95% KI']} rows={[['Intercept (b₀)',fmt(res.b0,4),fmt(res.seb0,4),fmt(res.b0CI[0],4)+' till '+fmt(res.b0CI[1],4)],['Lutning (b₁)',fmt(res.b1,4),fmt(res.seb1,4),fmt(res.b1CI[0],4)+' till '+fmt(res.b1CI[1],4)],['R²',fmt(res.r2,4),'—','—'],['p-värde (F)',fmtP(res.p),'—','—']]} th={th}/>
:<Tbl headers={['Koefficient','Estimat']} rows={[['Intercept',fmt(res.betas[0],4)],...res.xNames.map((n,i)=>[n,fmt(res.betas[i+1],4)]),[['R²',fmt(res.r2,4)]]].flat().map((v,i)=>typeof v==='string'?[v,'']: v)} th={th}/>}
</Card>}
</div>)};

// ---- LOGISTIC REGRESSION ----
const LogRegP=({cols,th})=>{
const [selY,setSelY]=useState(0);const [selX,setSelX]=useState(1);const [res,setRes]=useState(null);
if(!cols.length)return<Card th={th}><div style={{color:th.sub}}>Ladda data först.</div></Card>;
const run=()=>{const y=cols[selY]?.values||[],x=cols[selX]?.values||[];const n=Math.min(y.length,x.length);const ys=y.slice(0,n),xs=x.slice(0,n);// Newton-Raphson logistic regression
let b0=0,b1=0;for(let iter=0;iter<100;iter++){const p=xs.map(xi=>1/(1+Math.exp(-(b0+b1*xi))));const g0=ys.reduce((s,yi,i)=>s+(yi-p[i]),0);const g1=ys.reduce((s,yi,i)=>s+(yi-p[i])*xs[i],0);const h00=p.reduce((s,pi)=>s+pi*(1-pi),0);const h11=p.reduce((s,pi,i)=>s+pi*(1-pi)*xs[i]**2,0);const h01=p.reduce((s,pi,i)=>s+pi*(1-pi)*xs[i],0);const det=h00*h11-h01**2;if(Math.abs(det)<1e-15)break;b0+=( h11*g0-h01*g1)/det;b1+=(-h01*g0+h00*g1)/det;if(Math.abs(g0)<1e-10&&Math.abs(g1)<1e-10)break}const phat=xs.map(xi=>1/(1+Math.exp(-(b0+b1*xi))));const ll=ys.reduce((s,yi,i)=>s+yi*Math.log(Math.max(1e-15,phat[i]))+(1-yi)*Math.log(Math.max(1e-15,1-phat[i])),0);const or=Math.exp(b1);setRes({b0,b1,or,ll,n,xName:cols[selX].name,yName:cols[selY].name})};
return(<div>
<PageTitle title="📊 Logistisk regression" sub="Binär logistisk regression (Newton-Raphson)" th={th}/>
<div className="row">
<Field label="Y (binär utfall, 0/1)"><Sel value={selY} onChange={v=>setSelY(+v)} options={cols.map((c,i)=>({value:i,label:c.name}))} th={th}/></Field>
<Field label="X (prediktor)"><Sel value={selX} onChange={v=>setSelX(+v)} options={cols.map((c,i)=>({value:i,label:c.name}))} th={th}/></Field>
</div>
<Btn onClick={run} th={th}>Beräkna logistisk regression</Btn>
{res&&<Card th={th}><h3>Logistisk regression</h3>
<Tbl headers={['Parameter','Värde']} rows={[['Intercept (b₀)',fmt(res.b0,4)],['Koefficient (b₁)',fmt(res.b1,4)],['Odds Ratio (exp(b₁))',fmt(res.or,4)],['Log-likelihood',fmt2(res.ll)],['n',res.n]]} th={th}/>
</Card>}
</div>)};

// ---- POLYNOMIAL REGRESSION ----
const PolyRegP=({cols,th})=>{
const [selX,setSelX]=useState(0);const [selY,setSelY]=useState(1);const [deg,setDeg]=useState('2');const [res,setRes]=useState(null);
if(!cols.length)return<Card th={th}><div style={{color:th.sub}}>Ladda data först.</div></Card>;
const run=()=>{const x=cols[selX]?.values||[],y=cols[selY]?.values||[];const n=Math.min(x.length,y.length);const d=Math.min(+deg||2,6);const xs=x.slice(0,n),ys=y.slice(0,n);const Xm=xs.map(xi=>Array.from({length:d+1},(_,j)=>xi**j));const XtX=Array.from({length:d+1},(_,r)=>Array.from({length:d+1},(_,c)=>Xm.reduce((s,row)=>s+row[r]*row[c],0)));const Xty=Array.from({length:d+1},(_,r)=>Xm.reduce((s,row,i)=>s+row[r]*ys[i],0));const m=XtX.map((row,i)=>[...row,Xty[i]]);for(let c=0;c<=d;c++){const mx=m.reduce((bi,row,ri)=>Math.abs(row[c])>Math.abs(m[bi][c])?ri:bi,c);[m[c],m[mx]]=[m[mx],m[c]];for(let r2=0;r2<=d;r2++)if(r2!==c&&Math.abs(m[c][c])>1e-15){const f=m[r2][c]/m[c][c];m[r2]=m[r2].map((v,j)=>v-f*m[c][j])}}const b=m.map((row,i)=>row[d+1]/row[i]);const yhat=xs.map(xi=>b.reduce((s,bi,j)=>s+bi*xi**j,0));const sse=ys.reduce((s,yi,i)=>s+(yi-yhat[i])**2,0);const my=mean(ys),sst=ys.reduce((s,yi)=>s+(yi-my)**2,0);setRes({b,r2:1-sse/sst,n,d,xName:cols[selX].name,yName:cols[selY].name})};
return(<div>
<PageTitle title="📐 Polynomregression" sub="Icke-linjär anpassning med polynom" th={th}/>
<div className="row">
<Field label="X"><Sel value={selX} onChange={v=>setSelX(+v)} options={cols.map((c,i)=>({value:i,label:c.name}))} th={th}/></Field>

<Field label="Grad"><Inp value={deg} onChange={setDeg} type="number" min="1" max="6" th={th}/></Field>
</div>
<Btn onClick={run} th={th}>Anpassa polynom</Btn>
{res&&<Card th={th}><h3>Polynomregression (grad {res.d}), R²={fmt2(res.r2)}</h3>
<Tbl headers={['Term','Koefficient']} rows={res.b.map((bi,i)=>['x^'+i,fmt(bi,6)])} th={th}/>
</Card>}
</div>)};

// ---- LEVEY-JENNINGS ----
const LJP=({cols,th})=>{
const [sel,setSel]=useState(0);const [baseline,setBaseline]=useState('');const [baseSD,setBaseSD]=useState('');
if(!cols.length)return<Card th={th}><div style={{color:th.sub}}>Ladda data först.</div></Card>;
const a=(cols[sel]||cols[0]).values;const mu=parseFloat(baseline)||mean(a);const sigma=parseFloat(baseSD)||sd(a);
const data=a.map((v,i)=>({i:i+1,v,z:(v-mu)/sigma}));
const limits=[{y:mu+3*sigma,lbl:'+3SD',c:'#ef4444'},{y:mu+2*sigma,lbl:'+2SD',c:'#f59e0b'},{y:mu,lbl:'Medel',c:'#2563eb'},{y:mu-2*sigma,lbl:'−2SD',c:'#f59e0b'},{y:mu-3*sigma,lbl:'−3SD',c:'#ef4444'}];
const viol=data.filter(d=>Math.abs(d.z)>3);

// ---- WESTGARD RULES ----
const WGP=({cols,th})=>{
const [sel,setSel]=useState(0);const [baseline,setBaseline]=useState('');const [baseSD,setBaseSD]=useState('');const [res,setRes]=useState(null);
if(!cols.length)return<Card th={th}><div style={{color:th.sub}}>Ladda data först.</div></Card>;
const run=()=>{const a=(cols[sel]||cols[0]).values;const mu=parseFloat(baseline)||mean(a);const sig=parseFloat(baseSD)||sd(a);const z=a.map(v=>(v-mu)/sig);const violations=[];// 1:3s rule
z.forEach((zi,i)=>{if(Math.abs(zi)>3)violations.push({rule:'1:3s',pt:i+1,val:a[i].toFixed(4),z:zi.toFixed(3)})});// 2:2s rule
for(let i=1;i<z.length;i++){if((z[i]>2&&z[i-1]>2)||(z[i]<-2&&z[i-1]<-2))violations.push({rule:'2:2s',pt:i+1,val:a[i].toFixed(4),z:z[i].toFixed(3)})}// R:4s
for(let i=1;i<z.length;i++){if(Math.abs(z[i]-z[i-1])>4)violations.push({rule:'R:4s',pt:i+1,val:a[i].toFixed(4),z:z[i].toFixed(3)})}// 4:1s
for(let i=3;i<z.length;i++){if(z.slice(i-3,i+1).every(v=>v>1)||z.slice(i-3,i+1).every(v=>v<-1))violations.push({rule:'4:1s',pt:i+1,val:a[i].toFixed(4),z:z[i].toFixed(3)})}// 10x
for(let i=9;i<z.length;i++){if(z.slice(i-9,i+1).every(v=>v>0)||z.slice(i-9,i+1).every(v=>v<0))violations.push({rule:'10x',pt:i+1,val:a[i].toFixed(4),z:z[i].toFixed(3)})}setRes({violations,mu,sig,n:a.length})};
return(<div>
<PageTitle title="📋 Westgard-regler" sub="Multiregelkontroll för QC-prover" th={th}/>
<Card th={th}><div className="row">
<Field label="QC-data"><Sel value={sel} onChange={v=>setSel(+v)} options={cols.map((c,i)=>({value:i,label:c.name}))} th={th}/></Field>
<Field label="Baslinje μ"><Inp value={baseline} onChange={setBaseline} type="number" th={th}/></Field>
<Field label="Baslinje SD"><Inp value={baseSD} onChange={setBaseSD} type="number" th={th}/></Field>
</div><Btn onClick={run} th={th}>Tillämpa Westgard-regler</Btn></Card>
{res&&<><Card th={th}><h3>Regelkontroll — {res.n} mätpunkter</h3>
<div style={{marginBottom:8}}>μ={res.mu.toFixed(4)}, σ={res.sig.toFixed(4)}</div>
{res.violations.length===0?<div className="green">✓ Inga regelbrott detekterade!</div>:<>
<div className="red" style={{marginBottom:8}}>⚠️ {res.violations.length} regelbrott</div>

</>}

<Card th={th}><h3>Westgard-regler förklaring</h3>
<Tbl headers={['Regel','Varning/Fel','Beskrivning']} rows={[['1:3s','Fel','En punkt utanför ±3SD — slumpfel eller systematiskt fel'],['2:2s','Fel','Två på varandra följande punkter på samma sida av ±2SD'],['R:4s','Fel','Räckvidd > 4SD i konsekutiva par — slumpfel'],['4:1s','Varning','Fyra på varandra följande punkter på samma sida av ±1SD'],['10x','Varning','Tio på varandra följande punkter på samma sida av medel']]} th={th}/>
</Card>
</>}
</div>)};

// ---- SIX SIGMA ----
const SigmaP=({cols,th})=>{
const [sel,setSel]=useState(0);const [ref,setRef]=useState('');const [teaName,setTeaName]=useState('');const [teaCustom,setTeaCustom]=useState('');const [res,setRes]=useState(null);
if(!cols.length)return<Card th={th}><div style={{color:th.sub}}>Ladda data först.</div></Card>;

if(!cols.length)return<Card th={th}><div style={{color:th.sub}}>Ladda data först.</div></Card>;
const run=()=>{const x=cols[selX]?.values||[],y=cols[selY]?.values||[];const n=Math.min(x.length,y.length);const xs=x.slice(0,n),ys=y.slice(0,n);const rLin=linReg(xs,ys);// Polynomial for non-linearity test
const d=Math.min(+deg||2,4);const Xm=xs.map(xi=>Array.from({length:d+1},(_,j)=>xi**j));const XtX=Array.from({length:d+1},(_,r)=>Array.from({length:d+1},(_,c)=>Xm.reduce((s,row)=>s+row[r]*row[c],0)));const Xty=Array.from({length:d+1},(_,r)=>Xm.reduce((s,row,i)=>s+row[r]*ys[i],0));const m=XtX.map((row,i)=>[...row,Xty[i]]);for(let c=0;c<=d;c++){const mx=m.reduce((bi,row,ri)=>Math.abs(row[c])>Math.abs(m[bi][c])?ri:bi,c);[m[c],m[mx]]=[m[mx],m[c]];for(let r2=0;r2<=d;r2++)if(r2!==c&&Math.abs(m[c][c])>1e-15){const f=m[r2][c]/m[c][c];m[r2]=m[r2].map((v,j)=>v-f*m[c][j])}}const b=m.map((row,i)=>row[d+1]/row[i]);const yhatP=xs.map(xi=>b.reduce((s,bi,j)=>s+bi*xi**j,0));const ssePoly=ys.reduce((s,yi,i)=>s+(yi-yhatP[i])**2,0);const sst=ys.reduce((s,yi)=>s+(yi-mean(ys))**2,0);const r2Poly=1-ssePoly/sst;const yhatLin=xs.map(xi=>rLin.b0+rLin.b1*xi);const sseLin=ys.reduce((s,yi,i)=>s+(yi-yhatLin[i])**2,0);const r2Lin=1-sseLin/sst;const F=(sseLin-ssePoly)/(d-1)/(ssePoly/(n-d-1));const pLack=1-fCDF(F,d-1,n-d-1);setRes({r2Lin,r2Poly,F,pLack,linEq:{b0:rLin.b0,b1:rLin.b1},polyCoef:b,n,linear:pLack>.05})};
return(<div>
<PageTitle title="📏 Linjäritet" sub="Linearitetstest — CLSI EP6-A polynomtest" th={th}/>
<div className="row">
<Field label="X (förväntad/referens)"><Sel value={selX} onChange={v=>setSelX(+v)} options={cols.map((c,i)=>({value:i,label:c.name}))} th={th}/></Field>

<Field label="Polynomgrad för test"><Inp value={deg} onChange={setDeg} type="number" min="2" max="4" th={th}/></Field>
</div>
<Btn onClick={run} th={th}>Testa linjäritet</Btn>
{res&&<><Card th={th} style={{borderLeft:'4px solid '+(res.linear?'#16a34a':'#ef4444')}}>
<h3>EP6-A Linjäritetstest</h3>
<Tbl headers={['Parameter','Värde']} rows={[['R² (linjärt)',fmt(res.r2Lin,4)],['R² (polynom grad '+deg+')',fmt(res.r2Poly,4)],['F-test (avvikelse från linearitet)',fmt(res.F,4)],['p-värde',fmtP(res.pLack)],['Slutsats',res.linear?'✓ LINJÄRT (p>0.05, ingen signifikant avvikelse)':'✗ EJ LINJÄRT — signifikant polynomterm'],['Linjär ekvation','y = '+fmt(res.linEq.b0,4)+' + '+fmt(res.linEq.b1,4)+'x']]} th={th}/>

// ---- HOFFMANN METHOD ----
const HoffmannP=({cols,th})=>{
const [sel,setSel]=useState(0);const [res,setRes]=useState(null);
if(!cols.length)return<Card th={th}><div style={{color:th.sub}}>Ladda data först.</div></Card>;
const run=()=>{const a=[...(cols[sel]||cols[0]).values].sort((x,y)=>x-y);const n=a.length;if(n<50){setRes({err:'Hoffmann-metoden kräver minst 50 observationer'});return}// Hoffmann: plot normal scores vs cumulative fraction, fit linear through central portion
const mid=a.filter((_,i)=>i>=Math.floor(n*.05)&&i<=Math.floor(n*.95));const probs=mid.map((_,i)=>normInv((i+Math.floor(n*.05)+1)/(n+1)));const lr=linReg(probs,mid);if(!lr){setRes({err:'Beräkningsfel'});return}const lo=lr.b0-1.96*lr.b1,hi=lr.b0+1.96*lr.b1;setRes({lo,hi,mean:lr.b0,sd:lr.b1,n})};

// ---- EP49 CLINICAL VALIDITY ----
const EP49P=({cols,th})=>{
const [selScore,setSelScore]=useState(0);const [selLabel,setSelLabel]=useState(1);const [cutoff,setCutoff]=useState('');const [prev,setPrev]=useState('0.1');const [res,setRes]=useState(null);
if(!cols.length)return<Card th={th}><div style={{color:th.sub}}>Ladda data först.</div></Card>;
const run=()=>{const scores=cols[selScore]?.values||[],labels=cols[selLabel]?.values||[];const n=Math.min(scores.length,labels.length);const cut=parseFloat(cutoff);const prevV=parseFloat(prev)||.1;const roc=rocAnalysis(scores.slice(0,n),labels.slice(0,n));if(!roc){setRes({err:'Kontrollera etiketterna (0/1)'});return}// Use provided cutoff or optimal Youden
const useCut=sN(cut)?cut:roc.optimal?.t||0;const pos=labels.slice(0,n).filter(l=>l===1).length;const neg=n-pos;const data=scores.slice(0,n).map((s,i)=>({s,l:labels[i]}));const tp=data.filter(d=>d.s>=useCut&&d.l===1).length;const fp=data.filter(d=>d.s>=useCut&&d.l===0).length;const tn=data.filter(d=>d.s<useCut&&d.l===0).length;const fn=data.filter(d=>d.s<useCut&&d.l===1).length;const se=tp/pos,sp=tn/neg;const ppv=tp/(tp+fp)||0,npv=tn/(tn+fn)||0;// Adjust for prevalence using Bayes' theorem
const ppvPrev=se*prevV/(se*prevV+(1-sp)*(1-prevV));const npvPrev=sp*(1-prevV)/(sp*(1-prevV)+(1-se)*prevV);const lr_pos=se/(1-sp),lr_neg=(1-se)/sp;const dor=(tp*tn)/(fp*fn)||0;// LR-adjusted post-test probabilities
setRes({se,sp,ppv,npv,ppvPrev,npvPrev,lr_pos,lr_neg,dor,tp,fp,tn,fn,roc,cut:useCut,prev:prevV,n})};
return(<div>
<PageTitle title="📋 EP49 Klinisk validitet" sub="Diagnostisk prestanda — CLSI EP49 framework" th={th}/>
<Card th={th}><div className="row">
<Field label="Testresultat (scores)"><Sel value={selScore} onChange={v=>setSelScore(+v)} options={cols.map((c,i)=>({value:i,label:c.name}))} th={th}/></Field>

<Field label="Cutoff (tom = optimal Youden)"><Inp value={cutoff} onChange={setCutoff} type="number" th={th}/></Field>
<Field label="Prevalens (0-1, t.ex. 0.10 = 10%)"><Inp value={prev} onChange={setPrev} type="number" step="0.01" th={th}/></Field>
</div>
<Btn onClick={run} th={th}>Beräkna EP49</Btn>
</Card>
{res&&(res.err?<Card th={th}><div className="red">{res.err}</div></Card>:<>
<div className="stat-grid">
{[['Sensitivitet (Se)',(res.se*100).toFixed(1)+'%',res.se>=.9?'#16a34a':res.se>=.7?'#f59e0b':'#ef4444'],['Specificitet (Sp)',(res.sp*100).toFixed(1)+'%',res.sp>=.9?'#16a34a':res.sp>=.7?'#f59e0b':'#ef4444'],['PPV (rådata)',(res.ppv*100).toFixed(1)+'%',res.ppv>=.8?'#16a34a':'#f59e0b'],['NPV (rådata)',(res.npv*100).toFixed(1)+'%',res.npv>=.95?'#16a34a':'#f59e0b'],['PPV (prevalens '+Math.round(res.prev*100)+'%)',(res.ppvPrev*100).toFixed(1)+'%',res.ppvPrev>=.8?'#16a34a':'#f59e0b'],['NPV (prevalens)',(res.npvPrev*100).toFixed(1)+'%',res.npvPrev>=.95?'#16a34a':'#f59e0b'],['LR+ (likelihood ratio)',fmt(res.lr_pos,2),res.lr_pos>=10?'#16a34a':res.lr_pos>=5?'#84cc16':'#f59e0b'],['LR− (likelihood ratio)',fmt(res.lr_neg,3),res.lr_neg<=.1?'#16a34a':res.lr_neg<=.2?'#84cc16':'#f59e0b']].map(([l,v,c])=><div key={l} className="stat-box" style={{background:th.bg,borderColor:th.border}}><div className="stat-label">{l}</div><div className="stat-val" style={{color:c}}>{v}</div></div>)}
</div>
<Card th={th}><h3>Konfusionsmatris (Cutoff = {fmt2(res.cut)})</h3>

<tr><td/><td style={{padding:'6px 16px',fontWeight:700,textAlign:'center'}}>Sjuk (+)</td><td style={{padding:'6px 16px',fontWeight:700,textAlign:'center'}}>Frisk (−)</td></tr>
<tr><td style={{padding:'6px 16px',fontWeight:700}}>Test positiv</td><td style={{padding:'6px 16px',background:'#dcfce7',textAlign:'center',fontWeight:800,fontSize:18}}>{res.tp}</td><td style={{padding:'6px 16px',background:'#fee2e2',textAlign:'center',fontWeight:800,fontSize:18}}>{res.fp}</td></tr>
<tr><td style={{padding:'6px 16px',fontWeight:700}}>Test negativ</td><td style={{padding:'6px 16px',background:'#fee2e2',textAlign:'center',fontWeight:800,fontSize:18}}>{res.fn}</td><td style={{padding:'6px 16px',background:'#dcfce7',textAlign:'center',fontWeight:800,fontSize:18}}>{res.tn}</td></tr>
</tbody></table>
</Card>
<Card th={th}><h3>AUC = {fmt(res.roc.auc,4)} — ROC-kurva</h3>
<ResponsiveContainer width="100%" height={280}>

</>)}
